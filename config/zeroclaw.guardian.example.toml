# Optional Guardian settings for an existing ZeroClaw profile.
#
# This file deliberately does not define an LLM provider, model, or agent.
# Install the plugin into the ZeroClaw profile you already use; it will use that
# agent's existing model. With no entry below, Guardian uses its safe mainnet
# and devnet defaults. Add this entry only to select a custom RPC endpoint or
# an operator policy.

[plugins]
enabled = true

[plugins.security]
# Recommended when the profile requires signed plugins.
signature_mode = "strict"
trusted_publisher_keys = ["d743b2cd62da45564844b273760776c076642cec487700fdedfc601100e5c96d"]

[[plugins.entries]]
name = "solana-transaction-guardian"

[plugins.entries.config]
rpc_endpoints_json = "{\"mainnet-beta\":\"https://api.mainnet-beta.solana.com\",\"devnet\":\"https://api.devnet.solana.com\"}"
allowed_clusters_json = "[\"mainnet-beta\",\"devnet\"]"
request_timeout_ms = "5000"
max_rpc_calls = "6"
max_http_response_bytes = "2097152"
max_transaction_bytes = "1232"
max_output_bytes = "262144"
fail_closed = "true"
enable_simulation = "true"
policy_version = "default-1"
unknown_program_policy = "review"
unresolved_alt_policy = "block"
simulation_unavailable_policy = "block"
token2022_transfer_hook_policy = "review"
token2022_permanent_delegate_policy = "block"
