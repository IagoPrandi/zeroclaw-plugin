[package]
name = "solana-transaction-guardian"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Read-only Solana transaction analysis plugin for ZeroClaw"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
bincode = "1.3.3"
bs58 = "0.5.1"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
solana-message = { version = "4.4.0", features = ["serde"] }
solana-transaction = { version = "4.1.5", features = ["serde"] }
spl-token-2022-interface = "3.1.1"
spl-token-interface = "3.0.0"
thiserror = "2.0.17"
time = { version = "0.3.47", default-features = false, features = ["formatting", "std"] }

[target.'cfg(target_family = "wasm")'.dependencies]
waki = "0.5.1"
wit-bindgen = "0.46.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.9.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
