name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check.sh
